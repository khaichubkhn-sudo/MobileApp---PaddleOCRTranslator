name: Build APK

# Builds the app on GitHub's runners, where (unlike a typical sandboxed dev environment)
# there's unrestricted internet access to fetch the three binary pieces this project needs
# but doesn't ship: the Paddle Lite Java library, the OCR models, and the character
# dictionary. See README.md "Step 1-3" for what these are; this workflow automates
# fetching+placing all three, then builds.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      paddle_lite_asset_url:
        description: >
          Optional: exact .tar.gz URL for the Paddle-Lite android.armv7 java_full_publish
          release asset. Leave blank to auto-discover the latest one from GitHub Releases.
        required: false
        default: ""

env:
  # Canonical, stable model URLs from the official PaddleOCR docs. Swap these for a
  # different language/model pair if needed (see README.md Step 2).
  DET_MODEL_URL: https://paddleocr.bj.bcebos.com/PP-OCRv3/chinese/ch_PP-OCRv3_det_slim_infer.tar
  REC_MODEL_URL: https://paddleocr.bj.bcebos.com/PP-OCRv3/chinese/ch_PP-OCRv3_rec_slim_infer.tar
  DICT_URL: https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/main/ppocr/utils/ppocr_keys_v1.txt

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Set up Python (for the Paddle Lite model converter)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install paddle_lite_opt
        run: pip install paddlelite

      # ---- Step 1: Paddle Lite Java library (32-bit / armv7) ----
      - name: Locate Paddle Lite armv7 release asset
        id: locate_asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE_URL: ${{ github.event.inputs.paddle_lite_asset_url }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE_URL:-}" ]; then
            echo "Using manually supplied asset URL"
            echo "url=$OVERRIDE_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Auto-discovering latest android.armv7 release asset..."
          URL=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/PaddlePaddle/Paddle-Lite/releases \
            | jq -r '
                [.[] | select(.prerelease==false and .draft==false)]
                | .[].assets[]
                | select(.name | test("android\\.armv7"; "i"))
                | select(.name | test("\\.(tar\\.gz|tgz|zip)$"; "i"))
                | .browser_download_url
              ' | head -n1)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::Could not auto-discover a Paddle-Lite android.armv7 release asset." \
                     "Paddle-Lite's release asset naming changes between versions. Find one" \
                     "yourself at https://github.com/PaddlePaddle/Paddle-Lite/releases and" \
                     "re-run this workflow via 'Run workflow' with paddle_lite_asset_url set."
            exit 1
          fi
          echo "Found: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download + unpack Paddle Lite library
        run: |
          set -euo pipefail
          URL="${{ steps.locate_asset.outputs.url }}"
          mkdir -p /tmp/paddle_lite
          cd /tmp/paddle_lite

          FILENAME="$(basename "$URL")"
          curl -sSL -o "$FILENAME" "$URL"

          case "$FILENAME" in
            *.tar.gz|*.tgz) tar xf "$FILENAME" ;;
            *.zip) unzip -q "$FILENAME" ;;
            *) echo "::error::Unrecognized archive format: $FILENAME"; exit 1 ;;
          esac

          JAR_PATH="$(find . -type f -name 'PaddlePredictor.jar' | head -n1)"
          SO_PATH="$(find . -type f -name 'libpaddle_lite_jni.so' -path '*armeabi-v7a*' | head -n1)"
          if [ -z "$SO_PATH" ]; then
            SO_PATH="$(find . -type f -name 'libpaddle_lite_jni.so' | head -n1)"
          fi

          if [ -z "$JAR_PATH" ] || [ -z "$SO_PATH" ]; then
            echo "::error::Could not find PaddlePredictor.jar / libpaddle_lite_jni.so inside the downloaded archive."
            find . -maxdepth 4
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a"
          cp "$JAR_PATH" "$GITHUB_WORKSPACE/app/libs/PaddlePredictor.jar"
          cp "$SO_PATH" "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libpaddle_lite_jni.so"
          echo "Placed jar + so:"
          ls -la "$GITHUB_WORKSPACE/app/libs" "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a"

      # ---- Step 2: OCR models, converted to Paddle Lite .nb format ----
      - name: Download + convert detection + recognition models
        run: |
          set -euo pipefail
          mkdir -p /tmp/models && cd /tmp/models

          curl -sSL -o det_infer.tar "$DET_MODEL_URL"
          curl -sSL -o rec_infer.tar "$REC_MODEL_URL"
          tar xf det_infer.tar
          tar xf rec_infer.tar

          DET_DIR="$(find . -maxdepth 1 -type d -name '*det*' | head -n1)"
          REC_DIR="$(find . -maxdepth 1 -type d -name '*rec*' | head -n1)"

          paddle_lite_opt \
            --model_file="$DET_DIR/inference.pdmodel" \
            --param_file="$DET_DIR/inference.pdiparams" \
            --optimize_out_type=naive_buffer \
            --optimize_out=./det_db

          paddle_lite_opt \
            --model_file="$REC_DIR/inference.pdmodel" \
            --param_file="$REC_DIR/inference.pdiparams" \
            --optimize_out_type=naive_buffer \
            --optimize_out=./rec_crnn

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/models"
          rm -f "$GITHUB_WORKSPACE/app/src/main/assets/models/PUT_NB_MODELS_HERE.txt"
          cp det_db.nb "$GITHUB_WORKSPACE/app/src/main/assets/models/det_db.nb"
          cp rec_crnn.nb "$GITHUB_WORKSPACE/app/src/main/assets/models/rec_crnn.nb"

      # ---- Step 3: character dictionary ----
      - name: Download recognition dictionary
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/labels"
          rm -f "$GITHUB_WORKSPACE/app/src/main/assets/labels/PUT_DICT_HERE.txt"
          curl -sSL -o "$GITHUB_WORKSPACE/app/src/main/assets/labels/ppocr_keys_v1.txt" "$DICT_URL"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: paddle-ocr-translator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
