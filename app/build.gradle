plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.paddleocrtranslator'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.paddleocrtranslator"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Package the 64-bit ARM Paddle Lite binaries used by this app.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Paddle Lite ships models/native libs that are already compressed; don't let
    // the build tool try to re-compress them (also avoids some load failures).
    aaptOptions {
        noCompress "nb", "so"
    }

    packagingOptions {
        // Keep only the 64-bit ARM .so files required by Paddle Lite.
        jniLibs {
            pickFirsts += [
                "lib/arm64-v8a/libpaddle_lite_jni.so",
                "lib/arm64-v8a/libc++_shared.so"
            ]
        }
    }
}

def paddleLiteFiles = [
    file('libs/PaddlePredictor.jar'),
    file('src/main/jniLibs/arm64-v8a/libpaddle_lite_jni.so'),
    file('src/main/jniLibs/arm64-v8a/libc++_shared.so')
]

tasks.register('validatePaddleLiteFiles') {
    doLast {
        def missing = paddleLiteFiles.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                'Missing pre-downloaded Paddle Lite files:\n' +
                    missing.collect { " - ${it}" }.join('\n') +
                    '\nDownload them before building; the build does not fetch them.'
            )
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn('validatePaddleLiteFiles')
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Paddle Lite official Java API — NOT on Maven Central.
    // Download the "java_full_publish" (64-bit / arm64-v8a) release from
    // https://github.com/PaddlePaddle/Paddle-Lite/releases, pull out
    // java/PaddlePredictor.jar (or the .aar, if provided) and drop it into
    // app/libs/ before building. See README.md, step 2.
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}
