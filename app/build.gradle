plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.paddleocrtranslator'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.paddleocrtranslator"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Requirement: 32-bit Paddle Lite only. Do NOT add arm64-v8a / x86 here,
        // or the app will crash on 64-bit devices looking for a matching .so that
        // was never bundled.
        ndk {
            abiFilters "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Paddle Lite ships models/native libs that are already compressed; don't let
    // the build tool try to re-compress them (also avoids some load failures).
    aaptOptions {
        noCompress "nb", "so"
    }

    packagingOptions {
        // Keep only the 32-bit .so — if the Paddle Lite jar/aar you downloaded
        // bundles other ABIs, this makes sure they're stripped from the APK.
        jniLibs {
            pickFirsts += ["lib/armeabi-v7a/libpaddle_lite_jni.so"]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Paddle Lite official Java API — NOT on Maven Central.
    // Download the "java_full_publish" (32-bit / armeabi-v7a) release from
    // https://github.com/PaddlePaddle/Paddle-Lite/releases, pull out
    // java/PaddlePredictor.jar (or the .aar, if provided) and drop it into
    // app/libs/ before building. See README.md, step 2.
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}
